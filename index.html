<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ROBICT</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#87ceeb;
    font-family:sans-serif;
}


#joystickBase{
    position:fixed;
    bottom:30px;
    left:30px;
    width:120px;
    height:120px;
    background:rgba(255,255,255,0.15);
    border-radius:50%;
    z-index:1000;
    touch-action:none;
}

#joystick{
    position:absolute;
    width:60px;
    height:60px;
    background:rgba(255,255,255,0.7);
    border-radius:50%;
    left:30px;
    top:30px;
}
    
#jumpBtn{
    position:fixed;
    right:30px;
    bottom:40px;
    width:90px;
    height:90px;
    border:none;
    border-radius:50%;
    font-size:35px;
    background:rgba(255,255,255,0.3);
    color:white;
    z-index:1000;
}

#ui{
    position:fixed;
    top:10px;
    left:10px;
    z-index:10;
    color:white;
    background:rgba(0,0,0,0.5);
    padding:10px;
    border-radius:10px;
}

canvas{
    display:block;
}
</style>
</head>
<body>

    <!-- JOYSTICK HP -->
<div id="joystickBase">
  <div id="joystick"></div>
</div>

<!-- TOMBOL LOMPAT -->
<button id="jumpBtn">↑</button>

<div id="ui">
    <h2>ROBICT</h2>
    <p>WASD = Gerak</p>
    <p>Mouse = Lihat</p>
    <p>Click = Hancurkan blok</p>
    <p>Space = Lompat</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>
let scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

let camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    5000
);

let renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled =false;
document.body.appendChild(renderer.domElement);

let light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(20,50,20);
light.castShadow = true;
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff,0.4));

/* TEXTURE WARNA */
const textures = {
    grass: new THREE.MeshLambertMaterial({color:0x55aa55}),
    dirt: new THREE.MeshLambertMaterial({color:0x8b5a2b}),
    stone: new THREE.MeshLambertMaterial({color:0x888888})
};

    /* MOBILE JOYSTICK */
const joystick = document.getElementById("joystick");
const joystickBase = document.getElementById("joystickBase");
const jumpBtn = document.getElementById("jumpBtn");

let joyX = 0;
let joyY = 0;

joystickBase.addEventListener("touchmove",(e)=>{

    e.preventDefault();

    const touch = e.touches[0];

    const rect = joystickBase.getBoundingClientRect();

    const centerX = rect.left + rect.width/2;
    const centerY = rect.top + rect.height/2;

    let dx = touch.clientX - centerX;
    let dy = touch.clientY - centerY;

    const distance = Math.sqrt(dx*dx + dy*dy);

    const max = 40;

    if(distance > max){
        dx = dx / distance * max;
        dy = dy / distance * max;
    }

    joystick.style.left = (dx + 30) + "px";
    joystick.style.top = (dy + 30) + "px";

    joyX = dx / max;
    joyY = dy / max;
});

joystickBase.addEventListener("touchend",()=>{

    joystick.style.left = "30px";
    joystick.style.top = "30px";

    joyX = 0;
    joyY = 0;
});

    /* LOOK CAMERA HP */
let touchLook = false;
let lastTouchX = 0;
let lastTouchY = 0;

document.addEventListener("touchstart",(e)=>{

    /* kanan layar untuk kamera */
    if(e.touches[0].clientX > window.innerWidth/2){

        touchLook = true;

        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
    }

});

document.addEventListener("touchmove",(e)=>{

    if(touchLook){

        let touch = e.touches[0];

        let moveX = touch.clientX - lastTouchX;
        let moveY = touch.clientY - lastTouchY;

        yaw -= moveX * 0.005;
        pitch -= moveY * 0.005;

        pitch = Math.max(
            -Math.PI/2,
            Math.min(Math.PI/2,pitch)
        );

        camera.rotation.order = "YXZ";
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        lastTouchX = touch.clientX;
        lastTouchY = touch.clientY;
    }

});

document.addEventListener("touchend",()=>{

    touchLook = false;

});

/* TOMBOL LOMPAT */
jumpBtn.addEventListener("touchstart",()=>{

    if(canJump){
        velocityY = 0.2;
        canJump = false;
    }
});

/* BLOK */
const blocks = [];
const blockSize = 1;

function createBlock(x,y,z,material){

    const geo = new THREE.BoxGeometry(
        blockSize,
        blockSize,
        blockSize
    );

    const mesh = new THREE.Mesh(geo,material);

    mesh.position.set(x,y,z);

    /* MATIKAN SHADOW */
    mesh.castShadow = false;
    mesh.receiveShadow = false;

    scene.add(mesh);
    blocks.push(mesh);
}

/* DUNIA BESAR 100x100 */
for(let x=-80;x<80;x++){
    for(let z=-80;z<80;z++){

        createBlock(x,-1,z,textures.grass);

        /* GEDUNG RANDOM */
        if(Math.random() > 0.995){

            let tinggi = Math.floor(Math.random()*8)+3;

            for(let y=0;y<tinggi;y++){
                createBlock(x,y,z,textures.stone);
            }
        }

        /* JALAN */
        if(x % 10 === 0 || z % 10 === 0){
            createBlock(x,-1,z,new THREE.MeshLambertMaterial({
                color:0x333333
            }));
        }
    }
}

/* PLAYER */
camera.position.set(0,2,5);

let velocityY = 0;
let gravity = 0.01;
let canJump = true;

const keys = {};

document.addEventListener("keydown",(e)=>{
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup",(e)=>{
    keys[e.key.toLowerCase()] = false;
});

/* MOUSE LOOK */
let yaw = 0;
let pitch = 0;

document.body.addEventListener("click",()=>{
    document.body.requestPointerLock();
});

document.addEventListener("mousemove",(e)=>{
    if(document.pointerLockElement === document.body){

        yaw -= e.movementX * 0.002;
        pitch -= e.movementY * 0.002;

        pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2,pitch));

        camera.rotation.order = "YXZ";
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;
    }
});

/* HANCURKAN BLOK */
const raycaster = new THREE.Raycaster();

document.addEventListener("mousedown",()=>{

    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );

    const hits = raycaster.intersectObjects(blocks);

    if(hits.length > 0){
        scene.remove(hits[0].object);

        const index = blocks.indexOf(hits[0].object);

        if(index > -1){
            blocks.splice(index,1);
        }
    }
});

/* MOVEMENT */
function movePlayer(){

    /* GERAK HP SESUAI ARAH KAMERA */
let mobileForward = new THREE.Vector3();
camera.getWorldDirection(mobileForward);

mobileForward.y = 0;
mobileForward.normalize();

let mobileRight = new THREE.Vector3();
mobileRight.crossVectors(
    mobileForward,
    new THREE.Vector3(0,1,0)
);

/* MAJU MUNDUR */
camera.position.add(
    mobileForward.clone().multiplyScalar(-joyY * 0.15)
);

/* KIRI KANAN */
camera.position.add(
    mobileRight.clone().multiplyScalar(joyX * 0.15)
);

    let speed = 0.08;

    let forward = new THREE.Vector3();
    camera.getWorldDirection(forward);

    forward.y = 0;
    forward.normalize();

    let right = new THREE.Vector3();
    right.crossVectors(forward,new THREE.Vector3(0,1,0));

    if(keys["w"]){
        camera.position.add(forward.clone().multiplyScalar(speed));
    }

    if(keys["s"]){
        camera.position.add(forward.clone().multiplyScalar(-speed));
    }

    if(keys["a"]){
        camera.position.add(right.clone().multiplyScalar(speed));
    }

    if(keys["d"]){
        camera.position.add(right.clone().multiplyScalar(-speed));
    }

    /* LOMPAT */
    velocityY -= gravity;
    camera.position.y += velocityY;

    if(camera.position.y < 2){
        camera.position.y = 2;
        velocityY = 0;
        canJump = true;
    }

    if(keys[" "] && canJump){
        velocityY = 0.2;
        canJump = false;
    }
}

/* ANIMATE */
let lastFrame = 0;

function animate(time){

    requestAnimationFrame(animate);

    if(time - lastFrame < 1000/30) return;

    lastFrame = time;

animate();

/* RESIZE */
window.addEventListener("resize",()=>{

    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>

</body>
</html>
