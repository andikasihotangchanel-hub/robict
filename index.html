<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ROBICT</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#87ceeb;
    font-family:sans-serif;
}


#joystickBase{
    position:fixed;
    bottom:30px;
    left:30px;
    width:120px;
    height:120px;
    background:rgba(255,255,255,0.15);
    border-radius:50%;
    z-index:1000;
    touch-action:none;
}

#joystick{
    position:absolute;
    width:60px;
    height:60px;
    background:rgba(255,255,255,0.7);
    border-radius:50%;
    left:30px;
    top:30px;
}
    
#jumpBtn{
    position:fixed;
    right:30px;
    bottom:40px;
    width:90px;
    height:90px;
    border:none;
    border-radius:50%;
    font-size:35px;
    background:rgba(255,255,255,0.3);
    color:white;
    z-index:1000;
}

#ui{
    position:fixed;
    top:10px;
    left:10px;
    z-index:10;
    color:white;
    background:rgba(0,0,0,0.5);
    padding:10px;
    border-radius:10px;
}

canvas{
    display:block;
}
</style>
</head>
<body>

    <!-- JOYSTICK HP -->
<div id="joystickBase">
  <div id="joystick"></div>
</div>

<!-- TOMBOL LOMPAT -->
<button id="jumpBtn">↑</button>

<div id="ui">
    <h2>ROBICT</h2>
    <p>WASD = Gerak</p>
    <p>Mouse = Lihat</p>
    <p>Click = Hancurkan blok</p>
    <p>Space = Lompat</p>
</div>

    <!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
/* CONFIG FIREBASE */
const firebaseConfig = {

    apiKey: "AIzaSyCXLsN2MjwvzGn6pkqaiJRqORUznTCjWck",

    authDomain: "robotik-54835.firebaseapp.com",

    databaseURL: "https://robotik-54835-default-rtdb.firebaseio.com",

    projectId: "robotik-54835",

    storageBucket: "robotik-54835.firebasestorage.app",

    messagingSenderId: "799349248134",

    appId: "1:799349248134:web:fdef93e4cc0d33eba10107",

    measurementId: "G-Q1SYV08LQW"
};

/* START FIREBASE */
firebase.initializeApp(firebaseConfig);

/* DATABASE */
const db = firebase.database();

/* ID PLAYER */
const playerId =
    "player_" +
    Math.floor(Math.random()*999999);

/* PLAYER ONLINE */
const onlinePlayers = {};

/* UPDATE POSISI PLAYER */
function updateOnlinePlayer(){

    db.ref("players/" + playerId).set({

        x: camera.position.x,
        y: camera.position.y,
        z: camera.position.z
    });
}

/* HAPUS PLAYER SAAT KELUAR */
window.addEventListener("beforeunload",()=>{

    db.ref("players/" + playerId).remove();
});

/* LOAD PLAYER ONLINE */
db.ref("players").on("value",(snapshot)=>{

    const data = snapshot.val();

    if(!data) return;

    for(let id in data){

        /* SKIP PLAYER SENDIRI */
        if(id === playerId) continue;

        const p = data[id];

        /* BUAT PLAYER BARU */
        if(!onlinePlayers[id]){

            const mesh = new THREE.Mesh(

                new THREE.BoxGeometry(1,2,1),

                new THREE.MeshLambertMaterial({

                    color:Math.random()*0xffffff
                })
            );

            mesh.position.y = 1;

            scene.add(mesh);

            onlinePlayers[id] = mesh;
        }

        /* UPDATE POSISI */
        onlinePlayers[id].position.set(

            p.x,
            p.y,
            p.z
        );
    }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>
let scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

    /* FOG BIAR RENDER JAUH LEBIH RINGAN */
scene.fog = new THREE.Fog(0x87ceeb,20,120);

let camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    5000
);

let renderer = new THREE.WebGLRenderer({antialias:false});
    renderer.setPixelRatio(1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled =false;
document.body.appendChild(renderer.domElement);

let light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(20,50,20);
light.castShadow = false;
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff,0.4));

/* TEXTURE WARNA */
const textures = {
    grass: new THREE.MeshLambertMaterial({color:0x55aa55}),
    dirt: new THREE.MeshLambertMaterial({color:0x8b5a2b}),
    stone: new THREE.MeshLambertMaterial({color:0x888888})
};

    /* MOBILE JOYSTICK */
const joystick = document.getElementById("joystick");
const joystickBase = document.getElementById("joystickBase");
const jumpBtn = document.getElementById("jumpBtn");

let joyX = 0;
let joyY = 0;

joystickBase.addEventListener("touchmove",(e)=>{

    e.preventDefault();

    const touch = e.touches[0];

    const rect = joystickBase.getBoundingClientRect();

    const centerX = rect.left + rect.width/2;
    const centerY = rect.top + rect.height/2;

    let dx = touch.clientX - centerX;
    let dy = touch.clientY - centerY;

    const distance = Math.sqrt(dx*dx + dy*dy);

    const max = 40;

    if(distance > max){
        dx = dx / distance * max;
        dy = dy / distance * max;
    }

    joystick.style.left = (dx + 30) + "px";
    joystick.style.top = (dy + 30) + "px";

    joyX = dx / max;
    joyY = dy / max;
});

joystickBase.addEventListener("touchend",()=>{

    joystick.style.left = "30px";
    joystick.style.top = "30px";

    joyX = 0;
    joyY = 0;
});

    /* LOOK CAMERA HP */
let touchLook = false;
let lastTouchX = 0;
let lastTouchY = 0;

document.addEventListener("touchstart",(e)=>{

    /* kanan layar untuk kamera */
    if(e.touches[0].clientX > window.innerWidth/2){

        touchLook = true;

        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
    }

});

document.addEventListener("touchmove",(e)=>{

    if(touchLook){

        let touch = e.touches[0];

        let moveX = touch.clientX - lastTouchX;
        let moveY = touch.clientY - lastTouchY;

        yaw -= moveX * 0.005;
        pitch -= moveY * 0.005;

        pitch = Math.max(
            -Math.PI/2,
            Math.min(Math.PI/2,pitch)
        );

        camera.rotation.order = "YXZ";
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        lastTouchX = touch.clientX;
        lastTouchY = touch.clientY;
    }

});

document.addEventListener("touchend",()=>{

    touchLook = false;

});

/* TOMBOL LOMPAT */
jumpBtn.addEventListener("touchstart",()=>{

    if(canJump){
        velocityY = 0.2;
        canJump = false;
    }
});

/* BLOK */
const blocks = [];
const blockSize = 1;

function createBlock(x,y,z,material){

    const geo = new THREE.BoxGeometry(
        blockSize,
        blockSize,
        blockSize
    );

    const mesh = new THREE.Mesh(geo,material);

    mesh.position.set(x,y,z);

    /* MATIKAN SHADOW */
    mesh.castShadow = false;
    mesh.receiveShadow = false;

    scene.add(mesh);
    blocks.push(mesh);
}

/* WARNA RUMAH PLAYER */
const houseColors = [
    0xff5555,
    0xffaa00,
    0x00cc66,
    0xff66cc,
    0xaa55ff,
    0xff4444,
    0x00ddaa
];

const playerHouseColor =
houseColors[
    Math.floor(Math.random()*houseColors.length)
];

const playerHouseMaterial =
new THREE.MeshLambertMaterial({
    color:playerHouseColor
});

/* MATERIAL GEDUNG KOTA */
const cityMaterials = [
    new THREE.MeshLambertMaterial({color:0x777777}),
    new THREE.MeshLambertMaterial({color:0x222222}),
    new THREE.MeshLambertMaterial({color:0xcccccc}),
    new THREE.MeshLambertMaterial({color:0x4444aa})
];

/* TANAH + JALAN */
for(let x=-80;x<80;x++){
    for(let z=-80;z<80;z++){

        createBlock(x,-1,z,textures.grass);

        /* JALAN */
        if(x % 10 === 0 || z % 10 === 0){

            createBlock(
                x,
                -1,
                z,
                new THREE.MeshLambertMaterial({
                    color:0x333333
                })
            );
        }
    }
}

/* =========================
   RUMAH PLAYER
========================= */

for(let x=-4;x<=4;x++){
    for(let z=-4;z<=4;z++){

        /* LANTAI */
        createBlock(
            x,
            0,
            z,
            playerHouseMaterial
        );

        /* ATAP */
        createBlock(
            x,
            4,
            z,
            playerHouseMaterial
        );
    }
}

/* DINDING */
for(let y=1;y<4;y++){

    for(let x=-4;x<=4;x++){

        createBlock(x,y,-4,playerHouseMaterial);
        createBlock(x,y,4,playerHouseMaterial);
    }

    for(let z=-4;z<=4;z++){

        createBlock(-4,y,z,playerHouseMaterial);
        createBlock(4,y,z,playerHouseMaterial);
    }
}

/* PINTU */
scene.remove(blocks[blocks.length-1]);
scene.remove(blocks[blocks.length-2]);

/* INTERIOR */

/* MEJA */
createBlock(0,1,0,textures.dirt);

/* KURSI */
createBlock(1,1,0,textures.stone);

/* TEMPAT TIDUR */
createBlock(-2,1,0,
new THREE.MeshLambertMaterial({
    color:0xff0000
}));

/* SPAWN PLAYER */
camera.position.set(0,2,8);

/* =========================
   GEDUNG KOTA
========================= */

for(let i=0;i<120;i++){

    let bx =
    Math.floor(Math.random()*160)-80;

    let bz =
    Math.floor(Math.random()*160)-80;

    /* JANGAN DEKAT RUMAH PLAYER */
    if(
        bx > -15 &&
        bx < 15 &&
        bz > -15 &&
        bz < 15
    ) continue;

    let tinggi =
    Math.floor(Math.random()*10)+4;

    let material =
    cityMaterials[
        Math.floor(
            Math.random()*cityMaterials.length
        )
    ];

    for(let y=0;y<tinggi;y++){

        createBlock(
            bx,
            y,
            bz,
            material
        );
    }
}

/* PLAYER */
camera.position.set(0,2,5);

let velocityY = 0;
let gravity = 0.01;
let canJump = true;

const keys = {};

document.addEventListener("keydown",(e)=>{
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup",(e)=>{
    keys[e.key.toLowerCase()] = false;
});

/* MOUSE LOOK */
let yaw = 0;
let pitch = 0;

document.body.addEventListener("click",()=>{
    document.body.requestPointerLock();
});

document.addEventListener("mousemove",(e)=>{
    if(document.pointerLockElement === document.body){

        yaw -= e.movementX * 0.002;
        pitch -= e.movementY * 0.002;

        pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2,pitch));

        camera.rotation.order = "YXZ";
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;
    }
});

/* HANCURKAN BLOK */
const raycaster = new THREE.Raycaster();

document.addEventListener("mousedown",()=>{

    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );

    const hits = raycaster.intersectObjects(blocks);

    if(hits.length > 0){
        scene.remove(hits[0].object);

        const index = blocks.indexOf(hits[0].object);

        if(index > -1){
            blocks.splice(index,1);
        }
    }
});

    /* COLLISION */
function checkCollision(x,z){

    for(let block of blocks){

        let bx = block.position.x;
        let bz = block.position.z;
        let by = block.position.y;

        /* HANYA TABRAKAN BLOK ATAS TANAH */
        if(by >= 0){

            if(
                Math.abs(x - bx) < 0.8 &&
                Math.abs(z - bz) < 0.8
            ){
                return true;
            }
        }
    }

    return false;
}

/* COLLISION SYSTEM */
function checkCollision(x,z){

    /* TABRAK BLOK */
    for(let block of blocks){

        if(block.position.y >= 0){

            if(
                Math.abs(x - block.position.x) < 0.8 &&
                Math.abs(z - block.position.z) < 0.8
            ){
                return true;
            }
        }
    }


/* MOVEMENT */
function movePlayer(){

    /* GERAK HP SESUAI ARAH KAMERA */
let mobileForward = new THREE.Vector3();
camera.getWorldDirection(mobileForward);

mobileForward.y = 0;
mobileForward.normalize();

let mobileRight = new THREE.Vector3();
mobileRight.crossVectors(
    mobileForward,
    new THREE.Vector3(0,1,0)
);

/* MAJU MUNDUR */
let nextX =
    camera.position.x +
    (-mobileForward.x * joyY * 0.15);

let nextZ =
    camera.position.z +
    (-mobileForward.z * joyY * 0.15);

if(!checkCollision(nextX,nextZ)){

    camera.position.x = nextX;
    camera.position.z = nextZ;
}

/* KIRI KANAN */
nextX =
    camera.position.x +
    (mobileRight.x * joyX * 0.15);

nextZ =
    camera.position.z +
    (mobileRight.z * joyX * 0.15);

if(!checkCollision(nextX,nextZ)){

    camera.position.x = nextX;
    camera.position.z = nextZ;
}

    /* LOMPAT */
    velocityY -= gravity;
    camera.position.y += velocityY;

    if(camera.position.y < 2){
        camera.position.y = 2;
        velocityY = 0;
        canJump = true;
    }

    if(keys[" "] && canJump){
        velocityY = 0.2;
        canJump = false;
    }
}

    /* ANIMATE */
let lastFrame = 0;

function animate(time){

    requestAnimationFrame(animate);

    /* LIMIT 30 FPS */
    if(time - lastFrame < 1000/30) return;

    lastFrame = time;

    /* UPDATE PLAYER */
    movePlayer();

    updateOnlinePlayer();

    /* RENDER */
    renderer.render(scene,camera);
}

/* MULAI GAME */
animate();


/* RESIZE */
window.addEventListener("resize",()=>{

    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>

</body>
</html>
